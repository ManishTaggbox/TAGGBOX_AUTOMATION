name: Playwright Tests & Deploy
on:
  # push:
  #  branches: [ master ]
  workflow_dispatch: # allows manual trigger

jobs:
  test-and-deploy:
    runs-on: windows-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Fix Playwright permissions
      - name: Fix Playwright permissions
        run: chmod +x node_modules/.bin/playwright

      # ✅ Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: "C:\\Users\\runneradmin\\AppData\\Local\\ms-playwright"
          key: playwright-windows-${{ hashFiles('package-lock.json') }}

      # 5️⃣ Install Playwright browsers (Chromium only)
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 6️⃣ Run Playwright tests
      - name: Run Playwright Tests
        id: run-tests
        run: npx playwright test tests/feeds tests/productcatalog tests/profile tests/publish tests/moderation tests/login tests/dashboard
        env:
          CI: true
          ENV: ${{ secrets.ENV }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          ACCOUNT_51_EMAIL: ${{ secrets.ACCOUNT_51_EMAIL }}
          ACCOUNT_52_EMAIL: ${{ secrets.ACCOUNT_52_EMAIL }}
          ACCOUNT_53_EMAIL: ${{ secrets.ACCOUNT_53_EMAIL }}
          ACCOUNT_54_EMAIL: ${{ secrets.ACCOUNT_54_EMAIL }}
          ACCOUNT_55_EMAIL: ${{ secrets.ACCOUNT_55_EMAIL }}
          ACCOUNT_56_EMAIL: ${{ secrets.ACCOUNT_56_EMAIL }}
        continue-on-error: true

      # 7️⃣ Deploy to Netlify
      - name: Deploy to Netlify
        id: deploy
        run: npx netlify deploy --prod --dir=playwright-report --message "Test Deploy"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # 8️⃣ Send success email
      - name: Send Success Email
        if: steps.run-tests.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Playwright Tests PASSED — ${{ github.repository }}"
          to: ${{ secrets.TEAM_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          convert_markdown: true
          body: |
            ✅ **All Playwright tests passed successfully!**

            📋 **Run Details:**
            - **Repository**   : ${{ github.repository }}
            - **Branch**       : ${{ github.ref_name }}
            - **Triggered by** : ${{ github.actor }}
            - **Run ID**       : ${{ github.run_id }}
            - **Commit**       : ${{ github.sha }}

            📊 **Test Report:** https://taggboxautomation.netlify.app/#?

            🔗 **Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 9️⃣ Send failure email
      - name: Send Failure Email
        if: steps.run-tests.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Playwright Tests FAILED — ${{ github.repository }}"
          to: ${{ secrets.TEAM_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          convert_markdown: true
          body: |
            ❌ **Some Playwright tests have FAILED!**

            📋 **Run Details:**
            - **Repository**   : ${{ github.repository }}
            - **Branch**       : ${{ github.ref_name }}
            - **Triggered by** : ${{ github.actor }}
            - **Run ID**       : ${{ github.run_id }}
            - **Commit**       : ${{ github.sha }}

            📊 **Test Report:** https://taggboxautomation.netlify.app/#?

            🔗 **Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ⚠️ Please check the report above for detailed failure information and fix the failing tests.